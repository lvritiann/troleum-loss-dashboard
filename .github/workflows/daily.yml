name: daily-dashboard

# ============================================================================
# 驾驶舱云端跑批（脱离本地电脑）
#
# 本仓库同时充当两个角色：
#   ① 流水线源码仓库：_extract/*.py 取数/处理脚本 + bin/kdocs-cli.exe
#   ② GitHub Pages 输出仓库：根目录 index.html + all_data.json
#
# 每次跑：15 站 kdocs 表 → 清洗 → 分站处理 → 汇总 all_data.json → 提交回仓库 → Pages 自动刷新
#
# 为什么是 windows-latest：取数依赖 kdocs-cli.exe（Windows 二进制），Linux runner 跑不了。
#   换 Windows runner 后，本地整条流水线原样可跑，脚本零改写 —— 改动面最小、行为与本地一致。
#
# 触发：每日 00:00 北京时间（UTC 16:00）自动 + 网页 Actions 页可手动 Run workflow。
# ============================================================================

on:
  schedule:
    # GitHub Actions 的 cron 一律按 UTC 解释。16:00 UTC = 次日 00:00 北京时间（对齐历史本地跑批时刻）。
    - cron: "0 16 * * *"
  workflow_dispatch:

# 需要把刷新后的 all_data.json / index.html 提交回本仓库（deploy.py 走 Contents API）
permissions:
  contents: write

concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      KDOCS_CLI: ${{ github.workspace }}\bin\kdocs-cli.exe
      KDOCS_TOKEN: ${{ secrets.KDOCS_TOKEN }}
      GH_USER: ${{ github.repository_owner }}
      GH_REPO: ${{ github.event.repository.name }}
      GH_PAT: ${{ secrets.GITHUB_TOKEN }}
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 自检 kdocs-cli 与令牌
        shell: pwsh
        run: |
          if (!(Test-Path $env:KDOCS_CLI)) { throw "缺少 kdocs-cli：$env:KDOCS_CLI" }
          if ([string]::IsNullOrWhiteSpace($env:KDOCS_TOKEN)) { throw "缺少密钥 KDOCS_TOKEN（Settings → Secrets and variables → Actions）" }
          Write-Host "kdocs-cli 与令牌就绪（令牌长度 $($env:KDOCS_TOKEN.Length)）"

      - name: 取数（15 站 × 13 表）
        shell: pwsh
        run: python _extract/fetch_kdocs.py

      - name: 取数体检（防止空跑污染线上）
        shell: pwsh
        run: |
          $n = @(Get-ChildItem -Path "_extract\raw_*_ws2.json" -ErrorAction SilentlyContinue).Count
          Write-Host "拿到 ws2 原始数据的站点数：$n / 15"
          if ($n -lt 12) { throw "取数异常：仅 $n 站拿到数据（阈值 12），本次不发布。" }

      - name: 清洗 + 分站处理
        shell: pwsh
        run: python sync_daily.py --process-all

      - name: 汇总 all_data.json
        shell: pwsh
        run: python sync_daily.py --build

      - name: 发布前体检
        shell: pwsh
        run: |
          if (!(Test-Path all_data.json)) { throw "all_data.json 未生成" }
          $j = Get-Content all_data.json -Raw -Encoding UTF8 | ConvertFrom-Json
          Write-Host "generatedAt = $($j.generatedAt)"
          Write-Host "站点数 = $($j.stations.Count)"
          if ($j.stations.Count -lt 12) { throw "汇总异常：仅 $($j.stations.Count) 站（阈值 12），本次不发布。" }

      - name: 发布到 GitHub Pages
        shell: pwsh
        run: python sync_daily.py --deploy
